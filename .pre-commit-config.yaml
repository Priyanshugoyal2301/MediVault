repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  # Ruff — linting + formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Custom: block bare 'import logging' outside shared-utils
  - repo: local
    hooks:
      - id: no-raw-logging
        name: "No bare 'import logging' (use shared_utils.get_logger)"
        language: python
        entry: python scripts/check_no_raw_logging.py
        types: [python]
        # The script handles the allowlist internally (packages/shared-utils/logging.py)
        pass_filenames: true
