version: "3.9"

# =============================================================================
# MediVault AI — docker-compose (local dev)
# Each service has its own Dockerfile. Real config (ports, volumes, env vars)
# is filled in as each service is built. Stubs only at scaffold stage.
# =============================================================================

services:

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medivault}
      POSTGRES_USER: ${POSTGRES_USER:-medivault_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medivault_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    # Volumes and command filled in when service is built

  health-service:
    build:
      context: ./services/health-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    # Volumes and command filled in when service is built

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
    # Volumes and command filled in when service is built

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - health-service
      - ai-service
    # Volumes and command filled in when service is built

volumes:
  postgres_data:
