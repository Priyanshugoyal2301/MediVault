# MediVault local stack.
# Public entrypoints for a hackathon demo: api (:8000) + web (run via Vite).
# Health/AI bind to localhost only so spoofed X-User-ID cannot hit them from LAN.

services:

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medivault}
      POSTGRES_USER: ${POSTGRES_USER:-medivault_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medivault_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-medivault}
      POSTGRES_USER: medivault_auth
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD:?Set POSTGRES_AUTH_PASSWORD in .env}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY in .env}
      AUTH_ALGORITHM: ${AUTH_ALGORITHM:-HS256}
      AUTH_ACCESS_TOKEN_EXPIRE_MINUTES: ${AUTH_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY:?Set FILE_ENCRYPTION_KEY in .env}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  health-service:
    build:
      context: .
      dockerfile: services/health-service/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-medivault}
      POSTGRES_USER: medivault_health
      POSTGRES_PASSWORD: ${POSTGRES_HEALTH_PASSWORD:?Set POSTGRES_HEALTH_PASSWORD in .env}
      AI_SERVICE_URL: http://ai-service:8003
      STORAGE_LOCAL_PATH: /data/uploads
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY:?Set FILE_ENCRYPTION_KEY in .env}
      STORAGE_ACCOUNT_QUOTA_BYTES: ${STORAGE_ACCOUNT_QUOTA_BYTES:-1073741824}
      STORAGE_ACCOUNT_FILE_LIMIT: ${STORAGE_ACCOUNT_FILE_LIMIT:-500}
      STORAGE_MIN_FREE_BYTES: ${STORAGE_MIN_FREE_BYTES:-1073741824}
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    restart: unless-stopped
    environment:
      STORAGE_LOCAL_PATH: /data/uploads
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY:?Set FILE_ENCRYPTION_KEY in .env}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      TESSERACT_CMD: ${TESSERACT_CMD:-tesseract}
      USE_UNLIMITED_OCR: ${USE_UNLIMITED_OCR:-0}
      USE_ML_NORMALIZER: ${USE_ML_NORMALIZER:-0}
      USE_RISK_MODEL: ${USE_RISK_MODEL:-0}
      USE_EMBEDDING_SEARCH: ${USE_EMBEDDING_SEARCH:-0}
      USE_HEALTH_SCORE_MODEL: ${USE_HEALTH_SCORE_MODEL:-0}
      USE_OUTLIER_MODEL: ${USE_OUTLIER_MODEL:-0}
      USE_IMAGE_QUALITY_MODEL: ${USE_IMAGE_QUALITY_MODEL:-0}
      UNLIMITED_OCR_BACKEND: ${UNLIMITED_OCR_BACKEND:-auto}
      UNLIMITED_OCR_ENDPOINT: ${UNLIMITED_OCR_ENDPOINT:-}
      UNLIMITED_OCR_HF_MODEL: ${UNLIMITED_OCR_HF_MODEL:-baidu/Unlimited-OCR}
      UNLIMITED_OCR_TIMEOUT_S: ${UNLIMITED_OCR_TIMEOUT_S:-120}
      MEDIVAULT_FAST_KB: ${MEDIVAULT_FAST_KB:-1}
      MEDIVAULT_USE_DENSE: ${MEDIVAULT_USE_DENSE:-0}
    ports:
      - "127.0.0.1:8003:8003"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://auth-service:8001
      HEALTH_SERVICE_URL: http://health-service:8002
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY in .env}
      AUTH_ALGORITHM: ${AUTH_ALGORITHM:-HS256}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_CF_CONNECTING_IP: ${TRUST_CF_CONNECTING_IP:-false}
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - health-service

volumes:
  postgres_data:
  uploads_data:
