version: "3.9"

# MediVault local stack.
# Public entrypoints for a hackathon demo: api (:8000) + web (run via Vite).
# Health/AI bind to localhost only so spoofed X-User-ID cannot hit them from LAN.

services:

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medivault}
      POSTGRES_USER: ${POSTGRES_USER:-medivault_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medivault_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  health-service:
    build:
      context: .
      dockerfile: services/health-service/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      AI_SERVICE_URL: http://ai-service:8003
      STORAGE_LOCAL_PATH: /data/uploads
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      STORAGE_LOCAL_PATH: /data/uploads
    ports:
      - "127.0.0.1:8003:8003"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      AUTH_SERVICE_URL: http://auth-service:8001
      HEALTH_SERVICE_URL: http://health-service:8002
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - health-service

volumes:
  postgres_data:
  uploads_data:
