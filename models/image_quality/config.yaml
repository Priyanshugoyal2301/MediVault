# Document Image Quality — Phase 8

model_name: document_image_quality
version: "8.0.0"

primary_architecture: mobilenet_v3
fallback_architecture: efficientnet_lite0
baseline_architecture: opencv_rules

active_backend: auto
seed: 42
epochs: 3
train_n: 200
ready_threshold_score: 70
label_threshold: 0.45

paths:
  train_data: ../../datasets/image_quality
  artifacts: ./artifacts
  evaluation_out: ../../datasets/evaluation/image_quality_phase8_latest.json
