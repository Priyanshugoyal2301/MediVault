# Alembic configuration for MediVault AI
# Run from the repo root: alembic -c infra/migrations/alembic.ini upgrade head

[alembic]
script_location = infra/migrations
version_locations = infra/migrations/versions
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

# Database URL — read from environment variable at runtime (see env.py)
# Do NOT put a real DSN here; env.py reads POSTGRES_* env vars.
sqlalchemy.url = postgresql+asyncpg://placeholder/placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
