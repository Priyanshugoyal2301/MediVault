services:
  - type: web
    name: medivault-api
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerContext: .
    dockerfilePath: apps/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: AUTH_SECRET_KEY
        sync: false
      - key: AUTH_SERVICE_URL
        fromService:
          type: pserv
          name: medivault-auth
          property: hostport
      - key: HEALTH_SERVICE_URL
        fromService:
          type: pserv
          name: medivault-health
          property: hostport
      - key: INTERNAL_SERVICE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_CF_CONNECTING_IP
        value: "true"

  - type: pserv
    name: medivault-auth
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerContext: .
    dockerfilePath: services/auth-service/Dockerfile
    envVars:
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        value: postgres
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_SSL
        value: "true"
      - key: AUTH_SECRET_KEY
        sync: false
      - key: FILE_ENCRYPTION_KEY
        sync: false

  - type: pserv
    name: medivault-health
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerContext: .
    dockerfilePath: services/health-service/Dockerfile
    envVars:
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        value: postgres
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_SSL
        value: "true"
      - key: INTERNAL_SERVICE_KEY
        sync: false
      - key: FILE_ENCRYPTION_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_ACCESS_KEY
        sync: false
      - key: STORAGE_S3_SECRET_KEY
        sync: false
      - key: STORAGE_S3_REGION
        value: ap-south-1
      - key: AI_SERVICE_URL
        fromService:
          type: pserv
          name: medivault-ai
          property: hostport

  - type: pserv
    name: medivault-ai
    runtime: docker
    plan: 1c-2g
    region: singapore
    dockerContext: .
    dockerfilePath: services/ai-service/Dockerfile
    envVars:
      - key: INTERNAL_SERVICE_KEY
        sync: false
      - key: FILE_ENCRYPTION_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_ACCESS_KEY
        sync: false
      - key: STORAGE_S3_SECRET_KEY
        sync: false
      - key: STORAGE_S3_REGION
        value: ap-south-1
      - key: MEDIVAULT_FAST_KB
        value: "1"
      - key: MEDIVAULT_USE_DENSE
        value: "0"
